name = "ti4-web-new"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "dist"
binding = "ASSETS"

# Configured here instead of the dashboard's Bindings UI, which has open bugs around
# saving/persisting R2 bindings for Pages projects as of mid-2026.
[[r2_buckets]]
binding = "TI4ASSETS"
bucket_name = "ti4assets"
